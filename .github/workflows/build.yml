name: Gerar APK do LionFlix
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o projeto
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Aceitar licencas do Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Compilar
        working-directory: LionFlix
        run: gradle assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LionFlix-apk
          path: LionFlix/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LionFlix/app/build/outputs/apk/debug/app-debug.apk LionFlix.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk LionFlix.apk --title "LionFlix APK" --notes "Baixe o LionFlix.apk e instale"
